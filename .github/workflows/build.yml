name: Build

# Builds AgenTV's packages from agentv-os, signs them, publishes the pacman
# repository as the release named after its channel, then installs from it
# the way a box does (ADR-025). stable follows agentv-os's release tags, and
# edge every commit of its agentv branch that passed the Check workflow.
# Looks for something new every hour, and runs by hand for a channel and ref.
#
# Each channel goes through three jobs. The first builds, in an Arch
# container, without the signing key. The second has the key and does
# nothing but sign what the first built: it takes the files as they were
# built, checks them against the checksums the build wrote down, and runs
# bin/sign. The third publishes and installs. So the key is never in a job
# that runs pacman, makepkg or code from agentv-os.
#
# The key is AGENTV_SIGNING_KEY, read through the "release" environment,
# which only main may use. A run by hand on another branch builds, and
# then stops at the signing job.

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "agentv/**"
      - "agentv-keyring/**"
      - "agentv-voice/**"
      - "bin/**"
      - "test/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to build"
        type: choice
        options: [edge, stable]
        default: edge
      ref:
        description: "agentv-os ref, like tag=v0.1.0 or commit=<sha> (empty: what the channels would build next)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    name: What needs building
    runs-on: ubuntu-26.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ -n $REF ]]; then
            builds=$(bin/plan "$CHANNEL" "$REF")
          elif [[ $GITHUB_EVENT_NAME == "push" || $GITHUB_EVENT_NAME == "workflow_dispatch" ]]; then
            builds=$(bin/plan --all)
          else
            builds=$(bin/plan)
          fi
          echo "builds=$builds" >>"$GITHUB_OUTPUT"
          echo "Builds: $builds" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: "${{ matrix.channel }}: build"
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    # One output for each channel, since every channel's job writes here:
    # the checksum of the list of what it built.
    outputs:
      edge: ${{ steps.sums.outputs.edge }}
      stable: ${{ steps.sums.outputs.stable }}
    env:
      GH_TOKEN: ${{ github.token }}
      AGENTV_CHANNEL: ${{ matrix.channel }}
      AGENTV_REF: ${{ matrix.ref }}
      AGENTV_SOURCE: https://github.com/${{ github.repository_owner }}/agentv-os.git
      AGENTV_REPO_URL: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What's published already, so a version that's out there keeps its
      # exact file.
      - name: Fetch the published packages
        run: |
          mkdir -p repo
          gh release download "$AGENTV_CHANNEL" -R "$GITHUB_REPOSITORY" -D repo --pattern '*.pkg.tar.*' || true
          ls -l repo

      # No key in here: bin/build signs nothing.
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" \
            -e AGENTV_CHANNEL -e AGENTV_REF -e AGENTV_SOURCE -e AGENTV_REPO_URL \
            ghcr.io/archlinux/archlinux:latest /src/bin/build /src/repo
          # The container wrote them as its own users.
          sudo chown -R "$(id -u):$(id -g)" repo

      # The list the signing job checks the files against. Its own checksum
      # goes to that job as this job's output, not with the files.
      - name: Write down what was built
        id: sums
        run: |
          (cd repo && find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum --) >SHA256SUMS
          cat SHA256SUMS
          echo "$AGENTV_CHANNEL=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Hand the files to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repo/
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The only job that has the key. It builds nothing and fetches nothing but
  # the files the job above made.
  sign:
    name: "${{ matrix.channel }}: sign"
    needs: [plan, build]
    # A channel whose build failed stops at its own first step here, and the
    # other channel still gets signed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.builds != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      AGENTV_CHANNEL: ${{ matrix.channel }}
    steps:
      - name: The build's own list of what it made
        env:
          SUMS: ${{ needs.build.outputs[matrix.channel] }}
        run: |
          if [[ ! $SUMS =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::$AGENTV_CHANNEL wasn't built, so there's nothing to sign."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            bin
            agentv-keyring
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check the files are the ones the build made
        env:
          SUMS: ${{ needs.build.outputs[matrix.channel] }}
        run: |
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          (cd repo && sha256sum -c ../SHA256SUMS)
          # And nothing came with them that the build didn't list.
          diff <(cd repo && find . -maxdepth 1 -type f -printf '%f\n' | sort) <(sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort)
          [[ -z $(find repo -mindepth 1 ! -type f) ]]

      - name: Sign
        env:
          AGENTV_SIGNING_KEY: ${{ secrets.AGENTV_SIGNING_KEY }}
        run: bin/sign repo

      - name: Hand the signed files on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: "${{ matrix.channel }}: publish, install"
    needs: [plan, sign]
    # As for signing: one channel that failed doesn't hold the other back.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.builds != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      GH_TOKEN: ${{ github.token }}
      AGENTV_CHANNEL: ${{ matrix.channel }}
      AGENTV_REPO_URL: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # There's no such file when this channel wasn't built or signed, and
      # the job stops here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo

      - name: Publish
        run: bin/publish "$AGENTV_CHANNEL" repo

      - name: Install from the release, the way a box does
        run: |
          # The test's own exit status, not tee's.
          set -o pipefail
          version=$(find repo -maxdepth 1 -name 'agentv-[0-9]*-any.pkg.tar.zst' -printf '%f\n' |
            sed -E 's/^agentv-(.*)-[0-9]+-any\.pkg\.tar\.zst$/\1/')
          echo "agentv $version on $AGENTV_CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src:ro" -e AGENTV_REPO_URL \
            ghcr.io/archlinux/archlinux:latest /src/test/install-test.sh "$AGENTV_CHANNEL" "$version" |
            tee -a "$GITHUB_STEP_SUMMARY"
